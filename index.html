<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>透视原理 · 互动演示</title>
<link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
<div id="app">

  <!-- 顶部应用栏 -->
  <header id="toolbar" class="appbar">
    <div class="appbar-brand">
      <svg class="appbar-icon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path fill="currentColor" d="M3 8.5 12 3l9 5.5-9 5.5zM3 15.5 12 21l9-5.5-9-5.5z" opacity=".55"/>
        <path fill="currentColor" d="M12 8.5 21 14l-9 5.5L3 14z"/>
      </svg>
      <span class="appbar-title">透视原理 · 互动演示</span>
    </div>

    <div class="segmented" role="group" aria-label="工具切换">
      <button class="tool-btn segmented-btn select-btn active" data-tool="select" title="选择/查看：点击物体选中或切换，点击空白取消选中；拖动旋转视图，Shift+拖动平移，Ctrl/⌘+滚轮缩放">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="6.5" y="3" width="11" height="18" rx="5.5"/>
          <path d="M12 3v6"/>
        </svg>
        <span class="tool-txt">选择</span>
      </button>
      <button class="tool-btn segmented-btn" data-tool="move" title="拖动人眼 / 立方体 / 画布">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/>
          <polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/>
        </svg>
        <span class="tool-txt">移动</span>
      </button>
      <button class="tool-btn segmented-btn" data-tool="rotate" title="改变方向 / 朝向">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span class="tool-txt">旋转</span>
      </button>
      <button class="tool-btn segmented-btn" data-tool="scale" title="调整立方体大小">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <span class="tool-txt">缩放</span>
      </button>
    </div>

    <div class="appbar-actions">
      <button id="btn-add" class="m3-btn m3-btn-filled" title="添加立方体">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span class="btn-txt">添加立方体</span>
      </button>
      <button id="btn-reset" class="m3-btn m3-btn-tonal" title="重置为透视预设">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
        </svg>
        <span class="btn-txt">重置</span>
        <svg class="caret" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <button id="btn-toggle-panel" class="m3-btn m3-btn-tonal active" title="隐藏侧边栏">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        <span class="btn-txt">面板</span>
      </button>
    </div>
  </header>

  <!-- 主舞台 -->
  <main id="stage">
    <canvas id="scene"></canvas>

    <!-- 人眼视图悬浮按钮 -->
    <button id="btn-eyeview" class="fab-eye" title="人眼视图">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s3-7 11-7 11 7 11 7-3 7-11 7-11-7-11-7z"/>
        <circle cx="12" cy="12" r="2.5"/>
      </svg>
    </button>

    <!-- 移动端面板背板（点击关闭抽屉） -->
    <div id="panel-backdrop"></div>

    <aside id="panel">
      <section class="m3-card">
        <h3 class="m3-card-title">视图选项</h3>
        <label class="m3-switch"><input type="checkbox" id="opt-showSightLine" checked><span class="track"><span class="thumb"></span></span><span class="label">视线</span></label>
        <label class="m3-switch"><input type="checkbox" id="opt-showFrustum" checked><span class="track"><span class="thumb"></span></span><span class="label">视锥</span></label>
        <div class="m3-slider-row">
          <span class="slider-label">视锥角度</span>
          <input type="range" id="frustumAngle" min="5" max="90" step="1" value="45" aria-label="视锥角度">
          <span id="frustumVal" class="slider-val">45°</span>
        </div>
        <div class="m3-slider-row">
          <span class="slider-label">滚动灵敏度</span>
          <input type="range" id="zoomSens" min="5" max="200" step="5" value="50" aria-label="滚动缩放灵敏度">
          <span id="zoomSensVal" class="slider-val">50%</span>
        </div>
        <div class="m3-slider-row">
          <span class="slider-label">曲线光滑度</span>
          <input type="range" id="curveSmooth" min="4" max="128" step="1" value="64" aria-label="曲线光滑度" title="鱼眼透视下曲线细分段数，越高越平滑">
          <span id="curveSmoothVal" class="slider-val">64</span>
        </div>
        <label class="m3-switch"><input type="checkbox" id="opt-showProjectionLines" checked><span class="track"><span class="thumb"></span></span><span class="label">投影连线（点 ↔ 人眼 ↔ 画布）</span></label>
        <label class="m3-switch"><input type="checkbox" id="opt-showPerspective" checked><span class="track"><span class="thumb"></span></span><span class="label">画布上的平行透视图形</span></label>
        <label class="m3-switch"><input type="checkbox" id="opt-showLabels" checked><span class="track"><span class="thumb"></span></span><span class="label">物体标签</span></label>
      </section>

      <section class="m3-card" id="sel-panel" hidden>
        <h3 class="m3-card-title" id="sel-name">立方体</h3>
        <div id="sel-size" class="sel-info"></div>
        <label class="m3-switch"><input type="checkbox" id="opt-showParallelLines" checked><span class="track"><span class="thumb"></span></span><span class="label">显示平行线</span></label>
        <label class="m3-switch"><input type="checkbox" id="opt-showVanishingPoints" checked><span class="track"><span class="thumb"></span></span><span class="label">显示视图灭点</span></label>
        <label class="m3-switch"><input type="checkbox" id="opt-showCanvasVanishingPoints" checked><span class="track"><span class="thumb"></span></span><span class="label">显示画布灭点</span></label>
        <div class="legend">
          <span class="lg" style="--c:#e67e22">方向 1</span>
          <span class="lg" style="--c:#27ae60">方向 2</span>
          <span class="lg" style="--c:#8e44ad">方向 3</span>
        </div>
        <button id="btn-delete" class="m3-btn m3-btn-error">删除此立方体</button>
      </section>

      <section class="m3-card">
        <h3 class="m3-card-title">画布</h3>
        <div class="m3-slider-row" style="justify-content:space-between;margin-bottom:6px">
          <span class="slider-label">画布形状</span>
        </div>
        <div class="segmented seg-sm" id="canvasShape" role="group" aria-label="画布形状">
          <button class="segmented-btn shape-btn active" data-shape="flat" title="平面画布：经典透视">平面</button>
          <button class="segmented-btn shape-btn" data-shape="sphere" title="球形画布：等距鱼眼（球心=人眼）">球形</button>
          <button class="segmented-btn shape-btn" data-shape="hemisphere" title="半球形画布：球心=人眼，开口朝视线正前方">半球</button>
          <button class="segmented-btn shape-btn" data-shape="cylinder" title="圆柱画布：柱面展开（轴过人眼）">圆柱</button>
        </div>
        <label class="m3-switch"><input type="checkbox" id="opt-lockCanvas" checked><span class="track"><span class="thumb"></span></span><span class="label">锁定画布垂直于视线</span></label>
        <div class="m3-slider-row">
          <span class="slider-label">画布大小</span>
          <input type="range" id="canvasSize" min="0" max="2" step="0.01" value="1" aria-label="画布大小">
          <span id="canvasSizeVal" class="slider-val">100%</span>
        </div>
      </section>
    </aside>
  </main>

  <!-- 重置/透视预设菜单（悬浮，位置由 JS 计算） -->
  <div id="reset-menu" class="md3-menu" role="menu" hidden>
    <div class="md3-menu-title">重置为透视场景</div>
    <button class="md3-menu-item" data-reset="one"><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>一点透视</span></button>
    <button class="md3-menu-item" data-reset="two"><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>两点透视</span></button>
    <button class="md3-menu-item" data-reset="three"><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>三点透视</span></button>
    <button class="md3-menu-item" data-reset="four"><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>四点透视 · 圆柱</span></button>
    <button class="md3-menu-item" data-reset="five"><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>五点透视 · 半球</span></button>
    <button class="md3-menu-item" data-reset="six"><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>六点透视 · 球</span></button>
  </div>

  <!-- 底部状态栏 -->
  <footer id="statusbar" class="statusbar">
    <span id="status">移动：拖拽人眼/立方体/画布；空白处拖动旋转视图，滚轮缩放</span>
    <span id="info"></span>
  </footer>
</div>

<script src="js/math.js?v=13"></script>
<script src="js/scene.js?v=14"></script>
<script src="js/renderer.js?v=19"></script>
<script src="js/interaction.js?v=17"></script>
<script src="js/ui.js?v=20"></script>
<script src="js/main.js?v=11"></script>
</body>
</html>
